name: build-index
on:
  push:
    paths:
      - "surface.yaml"
      - "tools/**"
      - "tests/**"
      - "schema/**"
      - "receipts/**"
      - ".github/workflows/index.yml"
  pull_request:
    paths:
      - "surface.yaml"
      - "tools/**"
      - "tests/**"
      - "schema/**"
      - "receipts/**"
      - ".github/workflows/index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install "PyYAML==6.0.2"

      - name: Test generator
        run: python -m unittest discover -s tests -v

      - name: Verify evidence receipt
        run: |
          receipt_path="$(python -c 'import yaml; print(yaml.safe_load(open("surface.yaml", encoding="utf-8"))["verification_receipt"])')"
          python tools/verify_evidence_receipt.py "$receipt_path"

      - name: Regenerate index
        run: python tools/build_index.py

      - name: Verify generated files are current
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.json README.md

      - name: Commit regenerated index
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.json README.md
            git commit -m "chore(index): regenerate from surface.yaml"
            git push
          fi
